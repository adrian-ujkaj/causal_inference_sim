#===============================================================
# CONFIGURATION PRINCIPALE DU SIMULATEUR
#===============================================================
simulation:
  connect_mode: "gui"
  dt: 0.00416
  max_sim_time: 60.0

physics:
  gravity: [0.0, 0.0, -9.81]

world:
  type: "generated"
  city: {filename: "city",n_blocks_x: 4, n_blocks_y: 4, block_size: 20.0, road_width: 10.0, buildings_per_side: 3}
  res: 0.25
  Astar: {world_bounds: {x: [-60, 60], y: [-60, 60], z: [0.01, 60]}, safety_margin: 0.25}

swarm:
  
  - id: "A"
    leader: "drone_0"   
    min_sep: 0.6        
    avoid_gain: 0.5    
    port_in: 5556
    port_out: 5557
    ip: "localhost" 

agents:
  #------------------- LEADER (0,0,1) ------------------------
  - type: "uav"
    name: "drone_0"
    swarm_id: "A"
    urdf_path: "assets/quadrotor.urdf"
    body_id: 0000
    mass: 0.027
    start_pos: [0.0, 0.0, 0.0]
    start_orn_euler: [0.0, 0.0, 0.0]
    physics: {thrust_coeff: 3.16e-10, torque_coeff: 7.94e-12, max_rpm: 22000.0, motor_link_indices: [0, 1, 2, 3], max_speed: 5}
    waypoints: [[60.0, 60.0, 1.0],[-30.0, 0.0, 1.0],[0.0, 30.0, 25.0],[-60.0, 60.0, 1.0]]
    ctrl_freq: 80
    communication: {com_period: 0.1, com_delay_mean: 0.1, com_delay_std: 0.01}
    sensors:
      gnss: {enabled: true, position_noise_std: 0.1, velocity_noise_std: 0.05,frequency: 10, delay_mean: 0.1,delay_std: 0.01}
      imu: {enabled: true, accel_noise_std: 0.3, gyro_noise_std: 0.03, gravity: 9.81}
      lidar: {enabled: true, max_distance: 20.0, angle_resolution: 4.0, fov_horizontal: 90.0, fov_vertical: 30.0, frequency: 10.0}
    wind: {wind_mean: [0,0,0], turbulence: 10}
    radar : 
      - name: "Radar_Alpha"
        port : 5560
        ip : "localhost"
        pos: [0,0,0]

  #------------------- SUIVEURS (Décalés pour éviter la Sphère à -2,1) ------------------------
  - type: "uav"
    name: "drone_1"
    swarm_id: "A"
    urdf_path: "assets/quadrotor.urdf"
    body_id: 0001
    mass: 0.027
    start_pos: [-1, -1, 0.0] 
    start_orn_euler: [0.0, 0.0, 0.0]
    waypoints: []
    ctrl_freq: 80
    physics: {thrust_coeff: 3.16e-10, torque_coeff: 7.94e-12, max_rpm: 22000.0, motor_link_indices: [0, 1, 2, 3], max_speed: 5}
    communication: {com_period: 0.1, com_delay_mean: 0.1, com_delay_std: 0.01}
    sensors:
      gnss: {enabled: true, position_noise_std: 0.1, velocity_noise_std: 0.05,frequency: 10, delay_mean: 0.1,delay_std: 0.01}
      imu: {enabled: true, accel_noise_std: 0.3, gyro_noise_std: 0.03, gravity: 9.81}
      lidar: {enabled: true, max_distance: 20.0, angle_resolution: 4.0, fov_horizontal: 90.0, fov_vertical: 30.0, frequency: 10.0}
    wind: {wind_mean: [0,0,0], turbulence: 10}
    radar : 
      - name: "Radar_Alpha"
        port : 5560
        ip : "localhost"
        pos: [0,0,0]

  - type: "uav"
    name: "drone_2"
    swarm_id: "A"
    urdf_path: "assets/quadrotor.urdf"
    body_id: 0002
    mass: 0.027
    start_pos: [-1, 1, 0.0] 
    start_orn_euler: [0.0, 0.0, 0.0]
    waypoints: []
    ctrl_freq: 80
    physics: {thrust_coeff: 3.16e-10, torque_coeff: 7.94e-12, max_rpm: 22000.0, motor_link_indices: [0, 1, 2, 3], max_speed: 5}
    communication: {com_period: 0.1, com_delay_mean: 0.1, com_delay_std: 0.01}
    sensors:
      gnss: {enabled: true, position_noise_std: 0.1, velocity_noise_std: 0.05,frequency: 10, delay_mean: 0.1,delay_std: 0.01}
      imu: {enabled: true,accel_noise_mean: 0.5, accel_noise_std: 0.3, gyro_noise_std: 0.03, gravity: 9.81}
      lidar: {enabled: true, max_distance: 20.0, angle_resolution: 4.0, fov_horizontal: 90.0, fov_vertical: 30.0, frequency: 10.0}
    wind: {wind_mean: [0,0,0], turbulence: 10}
    radar : 
      - name: "Radar_Alpha"
        port : 5560
        ip : "localhost"
        pos: [0,0,0]


  - type: "uav"
    name: "drone_3"
    urdf_path: "assets/quadrotor.urdf"
    body_id: 0003
    mass: 0.027
    start_pos: [-2.0, 0.0, 0.0]
    start_orn_euler: [0.0, 0.0, 0.0]
    waypoints: [[-5.0,0,0],[-5.0,0,10]]
    safety_radius: 0.35
    max_repulsive_force: 1.0
    ctrl_freq: 80
    physics: {thrust_coeff: 3.16e-10, torque_coeff: 7.94e-12, max_rpm: 22000.0, motor_link_indices: [0, 1, 2, 3], max_speed: 5}
    communication: {com_period: 0.1, com_delay_mean: 0.1, com_delay_std: 0.01}
    sensors:
      gnss: {enabled: true, position_noise_std: 0.1, velocity_noise_std: 0.05,frequency: 10, delay_mean: 0.1,delay_std: 0.01}
      imu: {enabled: true, accel_noise_std: 0.3, gyro_noise_std: 0.03, gravity: 9.81}
      lidar: {enabled: true, max_distance: 20.0, angle_resolution: 4.0, fov_horizontal: 90.0, fov_vertical: 30.0, frequency: 10.0}
    wind: {wind_mean: [0,0,0], turbulence: 10}
    radar : 
      - name: "Radar_Alpha"
        port : 5560
        ip : "localhost"
        pos: [0,0,0]


  - name: "Radar_Alpha"
    type: "radar"
    pos: [3, 3, 0]      
    range: 30          
    urdf_path: "assets/radar.urdf"
    position_noise_std: 0.2
    velocity_noise_std: 0.1
    body_id: 1000
    port_out: 5560
    ip: "localhost"
    period: 1.0

